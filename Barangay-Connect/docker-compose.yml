version: '3.8'

services:
  backend:
    build: ./backend
    container_name: barangay-connect-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - JWT_SECRET
      - PORT=5000
      - NODE_ENV=production
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_EMAIL
      - SMTP_PASSWORD
      - FROM_EMAIL
      - FROM_NAME
      - FRONTEND_URL=https://barangay-connect.joalvergs.tech
      - CORS_ORIGIN=https://barangay-connect.joalvergs.tech
    networks:
      - barangay-net

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_API_URL=/api
    container_name: barangay-connect-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - barangay-net

networks:
  barangay-net:
    driver: bridge
