<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="vaultGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Chamfered Obsidian Square -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect width="64" height="64" rx="16" fill="url(#vaultGlow)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />
  
  <!-- Outer Shield / Vault Lock Contour -->
  <path d="M32 10 L50 17 C50 32 44 44 32 52 C20 44 14 32 14 17 Z" stroke="url(#vaultGrad)" stroke-width="2" stroke-linejoin="round" fill="#0f172a" fill-opacity="0.8" />
  
  <!-- Vault Combination Dial Core -->
  <circle cx="32" cy="30" r="9" stroke="url(#vaultGrad)" stroke-width="2" fill="#1e1b4b" fill-opacity="0.6" />
  <circle cx="32" cy="30" r="3" fill="#38bdf8" />
  
  <!-- Dial Notches -->
  <line x1="32" y1="18" x2="32" y2="21" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="32" y1="39" x2="32" y2="42" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="20" y1="30" x2="23" y2="30" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="41" y1="30" x2="44" y2="30" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Security Shackle Arc -->
  <path d="M26 21 V16 C26 12.686 28.686 10 32 10 C35.314 10 38 12.686 38 16 V21" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />

  <!-- Dynamic Spark / Star Flare -->
  <circle cx="48" cy="14" r="2" fill="#38bdf8" />
</svg>
